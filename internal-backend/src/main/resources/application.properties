spring.application.name=AssetAvengersInternal
server.port=${SERVER_PORT:8085}
spring.datasource.url=${ADMIN_DB_URL}
spring.datasource.username=${ADMIN_DB_USERNAME}
spring.datasource.password=${ADMIN_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
trading.base-url=${TRADING_API_URL:http://backend:8080}
superset.base-url=${SUPERSET_API_URL:http://superset:8088}
superset.public-url=${SUPERSET_PUBLIC_URL:http://localhost:8088}
superset.username=${SUPERSET_SERVICE_USER:internal-api}
superset.password=${SUPERSET_SERVICE_PASSWORD:}

superset.public-port=${SUPERSET_PUBLIC_PORT:8088}

# Staff security: the JWT contract with auth-server (same keys as the trading backend).
# No default for the secret on purpose: the app won't start without it.
jwt.shared-secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:endgame-auth}
# Only staff tokens name this audience (auth-server STAFF_JWT_AUDIENCE).
jwt.audience=${STAFF_JWT_AUDIENCE:endgame-staff}

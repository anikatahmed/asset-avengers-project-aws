@if (!hasInvestmentAccount()) {
  <div class="content account-empty-content">
    <section class="account-empty panel" aria-labelledby="empty-title">
      <div class="empty-icon" aria-hidden="true">+</div>
      <h2 id="empty-title">You have no accounts yet</h2>
      <p>Add an investment account to start using your accounts dashboard.</p>
      <a class="button primary" routerLink="/client/accounts">Create an account</a>
    </section>
  </div>
} @else {
<app-page-frame #frame page="Overview"
  ><app-portfolio-summary
    [value]="store.aggregateValue()"
    [totalReturn]="store.aggregateTotalReturn()"
    [valuationReady]="store.aggregateValuationReady()"
    [cash]="store.aggregateCash()"
    [assetCount]="store.aggregateHoldings().length"
    [aggregate]="true" />
  <div class="performance-grid">
  <app-performance-chart
    [value]="store.aggregateValue()"
    [totalReturn]="store.aggregateTotalReturn()"
    [ready]="performanceReady()"
    [aggregate]="true" />
  <app-portfolio-allocation
    class="overview-scroll-widget"
    [aggregate]="true" />
  </div>
  <div class="performance-grid">
  <app-holdings-table
    [assets]="store.aggregateHoldings()"
    [preview]="true"
    [aggregate]="true"
    (trade)="frame.openTrade($event)"
  />
  <app-market-watch
    class="overview-scroll-widget"
    [aggregate]="true" />
  </div>
</app-page-frame>
}

<app-page-frame #frame page="Portfolio"
  ><app-portfolio-summary
    [value]="store.value()"
    [totalReturn]="store.totalReturn()"
    [valuationReady]="store.valuationReady()"
    [cash]="store.cash()"
    [assetCount]="store.holdings().length" /><app-holdings-table
    [assets]="store.holdings()"
    (trade)="frame.openTrade($event)"
/></app-page-frame>

# AWS API/auth stack. Angular is hosted in S3/CloudFront; PostgreSQL is in RDS.
# Staff API, Kafka and reporting run from the separate
# deployment/admin-analytics/admin-analyst-stack.compose.yml and join trading_platform_network.
# Ports here are host entry points; containers use service names and internal ports.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: endgame_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:?set the RDS trading JDBC URL in .env}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_ISSUER=${JWT_ISSUER:-endgame-auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-endgame-api}
      - PRICING_API_BASE_URL=https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1
      - FAUXNANCE_PRICING_API_KEY=${FAUXNANCE_PRICING_API_KEY:?set FAUXNANCE_PRICING_API_KEY in .env}
      - PRICING_API_QUOTES_PATH=/quotes
      - PRICING_CACHE_TTL=${PRICING_CACHE_TTL:-PT15M}
      - PRICING_AUTOMATIC_DAILY_LIMIT=${PRICING_AUTOMATIC_DAILY_LIMIT:-1500}
      - PRICING_TOTAL_DAILY_LIMIT=${PRICING_TOTAL_DAILY_LIMIT:-1800}
    networks:
      - trading_platform_network

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: endgame_auth_server
    restart: unless-stopped
    ports:
      # Route browser requests through an HTTPS ingress/CloudFront API origin.
      - "${AUTH_SERVICE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SUPERSET_SSO_SECRET: ${SUPERSET_SSO_SECRET:-}
      # Container port stays 3000; database connections go to RDS.
      AUTH_SERVICE_PORT: 3000
      AUTH_DB_HOST: ${AUTH_DB_HOST:?set the RDS endpoint in .env}
      AUTH_DB_PORT: ${AUTH_DB_PORT:-5432}
      AUTH_DB_SSL: ${AUTH_DB_SSL:-true}
      AUTH_DB_SSL_CA: ${AUTH_DB_SSL_CA:-}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-endgame-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-endgame-api}
      # One audience per verifier: auth-server's own, and the staff service's (staff tokens only).
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-endgame-auth}
      STAFF_JWT_AUDIENCE: ${STAFF_JWT_AUDIENCE:-endgame-staff}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # Temporary dev switch, off unless .env says true (auth-server/src/auth/dev-mfa-bypass.ts).
      DEV_MFA_BYPASS: ${DEV_MFA_BYPASS:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env to a verified-domain sender}
      EMAIL_RESET_TEMPLATE_ID: ${EMAIL_RESET_TEMPLATE_ID:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-12}
      # Public frontend origin for requests reaching auth directly.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?set the CloudFront frontend origin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - trading_platform_network

networks:
  trading_platform_network:
    name: ${TRADING_NETWORK:-trading_platform_network}
    driver: bridge

# One-shot PostgreSQL client only; this never starts a database server.
services:
  bootstrap:
    image: postgres:18.6-trixie
    environment:
      PGHOST: ${RDS_HOST:-${SOURCE_DB_HOST:?set SOURCE_DB_HOST or RDS_HOST}}
      PGPORT: ${RDS_PORT:-5432}
      PGUSER: ${RDS_ADMIN_USER:?set RDS_ADMIN_USER}
      PGPASSWORD: ${RDS_ADMIN_PASSWORD:?set RDS_ADMIN_PASSWORD}
      PGSSLMODE: ${RDS_SSLMODE:-require}
      PGCONNECT_TIMEOUT: 15
      RDS_RESET_DATABASES: ${RDS_RESET_DATABASES:-false}
      POSTGRES_DB: ${POSTGRES_DB:-Endgame_Trading}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-admin_analytics}
      ADMIN_DB_SUPERUSER: ${ADMIN_DB_SUPERUSER:?set ADMIN_DB_SUPERUSER to a reporting owner login}
      ADMIN_DB_SUPERUSER_PASSWORD: ${ADMIN_DB_SUPERUSER_PASSWORD:?set ADMIN_DB_SUPERUSER_PASSWORD}
      ADMIN_DB_USERNAME: ${ADMIN_DB_USERNAME:-endgame_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
      ETL_DB_USERNAME: ${ETL_DB_USERNAME:-analytics_worker}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD}
      SUPERSET_REPORTING_USER: ${SUPERSET_REPORTING_USER:-superset_reader}
      SUPERSET_REPORTING_PASSWORD: ${SUPERSET_REPORTING_PASSWORD:?set SUPERSET_REPORTING_PASSWORD}
      SUPERSET_METADATA_DB: ${SUPERSET_METADATA_DB:-superset_metadata}
      SUPERSET_METADATA_USER: ${SUPERSET_METADATA_USER:-superset_metadata}
      SUPERSET_METADATA_PASSWORD: ${SUPERSET_METADATA_PASSWORD:?set SUPERSET_METADATA_PASSWORD}
    volumes:
      - ./create-databases.sql:/bootstrap/create-databases.sql:ro
    entrypoint:
      - /bin/bash
      - -euc
      - |
        case "$$PGHOST" in
          *YOUR-*|*REPLACE*|*://*|localhost|127.*|'')
            echo 'Set a real remote RDS hostname before running bootstrap.' >&2
            exit 1 ;;
        esac
        case "$$PGSSLMODE" in
          require) ;;
          *) echo 'Bootstrap requires RDS_SSLMODE=require for encrypted connections.' >&2; exit 1 ;;
        esac
        exec psql -X -q -v ON_ERROR_STOP=1 --dbname=postgres -f /bootstrap/create-databases.sql

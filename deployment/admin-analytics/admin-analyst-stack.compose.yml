# All deployment settings are loaded from repository-root .env with --env-file .env.
# Admin and analyst application stack: staff UI/API, reporting database, Kafka,
# reporting jobs and Superset. Run from the repository root as shown in README.md.
# The trading application owns the external network and authoritative database.
# Keep the project name in the CLI (-p), compatible with legacy Compose.
version: "3.8"

x-reporting-env: &reporting-env
  REPORTING_DB_HOST: reporting-db
  REPORTING_DB_NAME: ${ADMIN_DB_NAME:-admin_analytics}
  REPORTING_DB_USER: ${ETL_DB_USERNAME:-analytics_worker}
  REPORTING_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: trading-audit-v1

x-superset-env: &superset-env
  ENDGAME_AUTH_URL: http://auth-server:3000
  SUPERSET_SSO_SECRET: ${SUPERSET_SSO_SECRET:-}
  ADMIN_DB_NAME: ${ADMIN_DB_NAME:-admin_analytics}
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY}
  SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?set SUPERSET_GUEST_TOKEN_SECRET}
  SUPERSET_METADATA_USER: ${SUPERSET_METADATA_USER:-superset_metadata}
  SUPERSET_METADATA_PASSWORD: ${SUPERSET_METADATA_PASSWORD:?set SUPERSET_METADATA_PASSWORD}
  SUPERSET_METADATA_DB: ${SUPERSET_METADATA_DB:-superset_metadata}
  SUPERSET_REPORTING_USER: ${SUPERSET_REPORTING_USER:-superset_reader}
  SUPERSET_REPORTING_PASSWORD: ${SUPERSET_REPORTING_PASSWORD:?set SUPERSET_REPORTING_PASSWORD}
  SUPERSET_EMBED_ORIGINS: ${SUPERSET_EMBED_ORIGINS:-http://localhost:8086,http://localhost:5174,http://localhost:8084,http://localhost:4200}

services:
  # Angular role-specific routes: /admin and /analyst (no root login page).
  internal-frontend:
    build: ../../internal-frontend
    image: asset-internal-frontend:${STAFF_IMAGE_TAG:-local}
    restart: unless-stopped
    # Set STAFF_BIND_ADDRESS=0.0.0.0 in root .env for VM/LAN browser access.
    ports: ["${STAFF_BIND_ADDRESS:-127.0.0.1}:${INTERNAL_UI_PORT:-8086}:80"]
    depends_on:
      internal-backend: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The auth server lives on the trading network; staff data uses the internal API.
    networks: [internal, trading]

  reporting-db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADMIN_DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${ADMIN_DB_SUPERUSER_PASSWORD:?set ADMIN_DB_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${ADMIN_DB_NAME:-admin_analytics}
      ADMIN_DB_USERNAME: ${ADMIN_DB_USERNAME:-endgame_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
      ETL_DB_USERNAME: ${ETL_DB_USERNAME:-analytics_worker}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD}
      SUPERSET_REPORTING_USER: ${SUPERSET_REPORTING_USER:-superset_reader}
      SUPERSET_REPORTING_PASSWORD: ${SUPERSET_REPORTING_PASSWORD:?set SUPERSET_REPORTING_PASSWORD}
      SUPERSET_METADATA_USER: ${SUPERSET_METADATA_USER:-superset_metadata}
      SUPERSET_METADATA_PASSWORD: ${SUPERSET_METADATA_PASSWORD:?set SUPERSET_METADATA_PASSWORD}
      SUPERSET_METADATA_DB: ${SUPERSET_METADATA_DB:-superset_metadata}
    ports: ["127.0.0.1:${ADMIN_DB_PORT:-5434}:5432"]
    volumes:
      - reporting_data:/var/lib/postgresql
      - ../../DB/admin_analytics_db.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-databases.sql:/docker-entrypoint-initdb.d/02-logins.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atc \"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [internal]

  kafka-init:
    image: apache/kafka:4.1.2
    # One partition keeps the local deployment's cross-order/account projections ordered.
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "trading-audit-v1", "--partitions", "1", "--replication-factor", "1"]
    depends_on:
      kafka: {condition: service_healthy}
    networks: [internal]

  publisher:
    build: ../../admin-analytics/pipeline
    image: asset-analytics-pipeline:${STAFF_IMAGE_TAG:-local}
    command: ["publisher", "--backfill"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOURCE_DB_HOST: ${SOURCE_DB_HOST:-postgres}
      SOURCE_DB_NAME: ${POSTGRES_DB:-Endgame_Trading}
      SOURCE_DB_USER: ${DB_USERNAME:?set DB_USERNAME from the trading stack}
      SOURCE_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD from the trading stack}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    networks: [internal, trading]

  consumer:
    build: ../../admin-analytics/pipeline
    image: asset-analytics-pipeline:${STAFF_IMAGE_TAG:-local}
    command: ["consumer"]
    restart: unless-stopped
    environment: *reporting-env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      reporting-db: {condition: service_healthy}
    networks: [internal]

  reporting-job:
    build: ../../admin-analytics/pipeline
    image: asset-analytics-pipeline:${STAFF_IMAGE_TAG:-local}
    command: ["scheduler"]
    restart: unless-stopped
    environment: *reporting-env
    depends_on:
      reporting-db: {condition: service_healthy}
    networks: [internal]

  internal-backend:
    build: ../../internal-backend
    image: asset-internal-backend:${STAFF_IMAGE_TAG:-local}
    restart: unless-stopped
    ports: ["127.0.0.1:${INTERNAL_API_PORT:-8085}:8085"]
    environment:
      ADMIN_DB_URL: jdbc:postgresql://reporting-db:5432/${ADMIN_DB_NAME:-admin_analytics}
      ADMIN_DB_USERNAME: ${ADMIN_DB_USERNAME:-endgame_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?use the same JWT_SECRET as auth-server}
      JWT_ISSUER: ${JWT_ISSUER:-endgame-auth}
      # The staff service accepts only tokens auth-server issued for staff (aud contains this).
      STAFF_JWT_AUDIENCE: ${STAFF_JWT_AUDIENCE:-endgame-staff}
      TRADING_API_URL: ${TRADING_API_URL:-http://backend:8080}
      SUPERSET_API_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-auto}
      SUPERSET_PUBLIC_PORT: ${SUPERSET_PORT:-8088}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-internal-api}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?set SUPERSET_SERVICE_PASSWORD}
    depends_on:
      reporting-db: {condition: service_healthy}
    networks: [internal, trading]

  superset-init:
    build: ../../admin-analytics/superset
    image: asset-analytics-superset:${STAFF_IMAGE_TAG:-local}
    command: ["sh", "/app/init-analytics.sh"]
    environment:
      <<: *superset-env
      ADMIN_DB_SUPERUSER: ${ADMIN_DB_SUPERUSER:-postgres}
      ADMIN_DB_SUPERUSER_PASSWORD: ${ADMIN_DB_SUPERUSER_PASSWORD:?set ADMIN_DB_SUPERUSER_PASSWORD}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-dashboard-author}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-internal-api}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?set SUPERSET_SERVICE_PASSWORD}
    depends_on:
      reporting-db: {condition: service_healthy}
    networks: [internal]

  superset:
    build: ../../admin-analytics/superset
    image: asset-analytics-superset:${STAFF_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *superset-env
    ports: ["${STAFF_BIND_ADDRESS:-127.0.0.1}:${SUPERSET_PORT:-8088}:8088"]
    depends_on:
      superset-init: {condition: service_completed_successfully}
    networks: [internal, trading]

networks:
  internal:
  trading:
    external: true
    name: ${TRADING_NETWORK:-trading_platform_network}
volumes:
  reporting_data:
  kafka_data:

openapi: 3.0.3

info:
  title: Endgame Trading API
  version: 0.1.0
  description: |
    Trading service called by the Angular client.

    - Every request needs a JWT from the auth service. The client is identified
      by the token's `sub`, so `/me/...` endpoints only ever return the
      caller's own data.
    - Prices, quantities and amounts are decimal strings (e.g. `"150.25"`).
    - Market data comes from Fauxnance, so only its markets are supported:
      US and Indian equities, ETFs, FX and crypto.
    - Orders are never edited or deleted; cancelling records a new status.

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

tags:
  - name: Instruments
    description: Looking up a tradable instrument by symbol.
  - name: MarketData
    description: Indicative prices from Fauxnance.
  - name: Orders
    description: Placing, cancelling and viewing your own orders.
  - name: Account
    description: Your cash and holdings.
  - name: Transactions
    description: Simulated deposits, withdrawals, dividends (separate from orders).
  - name: Admin
    description: Finding clients and investigating orders.

paths:
  # --- Instruments ------------------------------------------------------------
  /instruments/{symbol}:
    get:
      tags: [Instruments]
      operationId: getInstrument
      summary: Get one instrument
      description: |
        Roles: any signed-in user.

        Looked up from Fauxnance the first time a symbol is requested, then served from our database.
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: The instrument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'

  # --- Market data ------------------------------------------------------------
  /quotes/{symbol}:
    get:
      tags: [MarketData]
      operationId: getQuote
      summary: Get an indicative quote
      description: |
        Roles: any signed-in user.

        Buys execute at `ask`, sells at `bid`. The final price is set at execution.
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: The latest quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'

  /quotes:
    get:
      tags: [MarketData]
      operationId: getQuotes
      summary: Get quotes for up to 25 symbols
      description: |
        Roles: any signed-in user.

        Symbols with no quote (including unknown symbols) are listed in
        `unavailable` instead of failing the request. 503 only when market
        data is down entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TickerBatchRequest'
      responses:
        '200':
          description: Quotes found, plus any symbols with no quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/MarketDataUnavailable'

  # --- Orders -----------------------------------------------------------------
  /me/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order
      description: |
        Roles: CLIENT.

        Checks the order against the trading rules, then executes it
        asynchronously. Poll `GET /me/orders/{orderId}` until the status is
        FILLED, REJECTED or CANCELLED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '202':
          description: Passed the rules. Cash or holding is reserved and the order is ACCEPTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/OrderRejected'

    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: List my orders, newest first
      description: |
        Roles: CLIENT.

        All parameters are optional.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: Get one of my orders
      description: |
        Roles: CLIENT.

        Another client's order returns 404, so its existence is not revealed.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Orders]
      operationId: updateMyOrder
      summary: Change the price of an open order
      description: |
        Roles: CLIENT.

        Only an ACCEPTED LIMIT or STOP_LIMIT order can be changed. The reservation
        is recalculated, and the change is recorded in the order's lifecycle.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotUpdatable'
        '422':
          $ref: '#/components/responses/UpdateRefused'

  /me/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelMyOrder
      summary: Cancel an open order
      description: |
        Roles: CLIENT.

        Only an ACCEPTED order can be cancelled. Its reservation is released.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotCancellable'

  # --- Account --------------------------------------------------------------
  /me/accounts/{accountId}:
    get:
      tags: [Account]
      operationId: getMyAccount
      summary: Get my cash balances and holdings
      description: |
        Roles: CLIENT.

        A new client gets empty `cash` and `positions` arrays.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Transactions -------------------------------------------------------------------
  /me/transactions:
    post:
      tags: [Transactions]
      operationId: createTransactions
      summary: A transaction is any deposit, withdraw, or dividend of simulated cash
      description: "Roles: CLIENT."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashMovementRequest'
      responses:
        '201':
          description: Movement recorded and balance updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InsufficientCash'

  # --- Admin ------------------------------------------------------------------
  /admin/clients:
    get:
      tags: [Admin]
      operationId: searchClients
      summary: Find a client by email
      description: |
        Roles: ADMIN, SUPER_ADMIN.

        Returns an empty page when nothing matches.
      parameters:
        - name: q
          in: query
          required: true
          description: Partial email match.
          schema:
            type: string
            minLength: 3
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of matching clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders:
    get:
      tags: [Admin]
      operationId: searchOrders
      summary: Search orders across all clients
      description: |
        Roles: ADMIN, SUPER_ADMIN.

        Give `clientId` or `symbol` (or both); neither returns 400.
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders/{orderId}/lifecycle:
    get:
      tags: [Admin]
      operationId: getOrderLifecycle
      summary: Get everything that happened to an order
      description: "Roles: ADMIN, SUPER_ADMIN."
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order and its events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLifecycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Claims: `sub` (stable user UUID), `email`, `roles`
        (CLIENT, ANALYST, ADMIN, SUPER_ADMIN), `exp`.

  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      description: Fauxnance symbol, e.g. `AAPL`, `INFY.NS`, `FX:EURUSD`.
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      description: account id
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request. Nothing was recorded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Bad Request
            status: 400
            code: VALIDATION_ERROR
            errors:
              - field: limitPrice
                message: is required for LIMIT orders
    Unauthorized:
      description: Missing, invalid or expired token. No body (sent by Spring Security).
    Forbidden:
      description: Your role cannot use this endpoint. No body (sent by Spring Security).
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Not Found
            status: 404
            code: NOT_FOUND
    OrderRejected:
      description: The order broke a trading rule. It is recorded as REJECTED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Insufficient cash
            status: 422
            code: INSUFFICIENT_CASH
            detail: This order needs 1510.00 USD but 1200.00 USD is available.
            orderId: 3f6c2a0e-8b1d-4c5e-9a7f-2d4b6e8c1a90
    InsufficientCash:
      description: Withdrawal is larger than the available balance.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Insufficient cash
            status: 422
            code: INSUFFICIENT_CASH
            detail: Only 1200.00 USD is available to withdraw.
    NotCancellable:
      description: The order is already FILLED, REJECTED or CANCELLED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Order cannot be cancelled
            status: 409
            code: ORDER_NOT_CANCELLABLE
            detail: This order has already been filled.
    NotUpdatable:
      description: |
        The order is not an ACCEPTED LIMIT or STOP_LIMIT order (e.g. it has
        already filled), or `stopPrice` was sent after the stop was triggered.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Order cannot be updated
            status: 409
            code: ORDER_NOT_UPDATABLE
            detail: This order has already been filled.
    UpdateRefused:
      description: The new price needs more cash than is available. The order is unchanged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Insufficient cash
            status: 422
            code: INSUFFICIENT_CASH
            detail: The new price needs 1600.00 USD reserved but 1510.00 USD is available.
    MarketDataUnavailable:
      description: Market data is temporarily unavailable. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            title: Market data unavailable
            status: 503
            code: MARKET_DATA_UNAVAILABLE

  schemas:
    # --- Shared ---------------------------------------------------------------
    Decimal:
      type: string
      format: number
      description: Exact decimal as a string. Maps to BigDecimal.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    ApiError:
      type: object
      description: RFC 9457 Problem Details with extra `code`, `errors` and `orderId`.
      required: [title, status, code]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        orderId:
          type: string
          format: uuid
          description: Set when an order was rejected.
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # --- Instruments and quotes -----------------------------------------------
    AssetClass:
      type: string
      enum: [EQUITY, ETF, FX, CRYPTO]
    Exchange:
      type: string
      enum: [NYSE, NASDAQ, NSE, BSE, FX, CRYPTO]
    Instrument:
      type: object
      required: [id, symbol, name, assetClass, exchange, currency, tradable]
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        exchange:
          $ref: '#/components/schemas/Exchange'
        currency:
          $ref: '#/components/schemas/Currency'
        tradable:
          type: boolean
      example:
        id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        symbol: AAPL
        name: Apple Inc.
        assetClass: EQUITY
        exchange: NASDAQ
        currency: USD
        tradable: true
    Quote:
      type: object
      required: [symbol, price, bid, ask, currency, marketState, asOf, stale]
      properties:
        symbol:
          type: string
        price:
          $ref: '#/components/schemas/Decimal'
        bid:
          $ref: '#/components/schemas/Decimal'
        ask:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        marketState:
          type: string
          enum: [OPEN, CLOSED, PRE, POST, UNKNOWN]
        asOf:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True if the price could not be refreshed. Stale quotes are never traded on.
      example:
        symbol: AAPL
        price: '313.53'
        bid: '313.50'
        ask: '313.56'
        currency: USD
        marketState: OPEN
        asOf: '2026-09-25T14:02:00Z'
        stale: false
    QuoteBatch:
      type: object
      required: [quotes, unavailable]
      properties:
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        unavailable:
          type: array
          items:
            type: string

    # --- Orders ---------------------------------------------------------------
    OrderSide:
      type: string
      enum: [BUY, SELL]
    OrderType:
      type: string
      description: |
        MARKET: executes at the next quote.
        LIMIT: waits until the price reaches `limitPrice`.
        STOP_LIMIT: waits until the price reaches `stopPrice`, then acts as a LIMIT order.
      enum: [MARKET, LIMIT, STOP_LIMIT]
    OrderStatus:
      type: string
      description: |
        FILLED, REJECTED and CANCELLED are final. SUBMITTED is only seen in an
        order's lifecycle; placing an order returns it as ACCEPTED or REJECTED.
      enum: [SUBMITTED, ACCEPTED, FILLED, REJECTED, CANCELLED]
    CreateOrderRequest:
      type: object
      required: [clientOrderId, symbol, side, orderType, quantity]
      properties:
        clientOrderId:
          type: string
          format: uuid
          description: |
            Idempotency key. Generated by the client (e.g. `crypto.randomUUID()`)
            once per order and re-sent unchanged on retries. A repeated value
            returns the original result (the same 202 or 422) instead of
            creating a second order.
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          $ref: '#/components/schemas/Decimal'
        limitPrice:
          $ref: '#/components/schemas/Decimal'
        stopPrice:
          $ref: '#/components/schemas/Decimal'
      example:
        clientOrderId: 9b1e4c2a-7d3f-4a8e-b6c5-1f2e3d4c5b6a
        symbol: AAPL
        side: BUY
        orderType: LIMIT
        quantity: '10'
        limitPrice: '150.00'
    UpdateOrderRequest:
      type: object
      description: |
        Send only the prices you want to change. Re-sending the same request
        is safe (it sets the same price again), so no idempotency key is needed.
        `stopPrice` is only allowed on a STOP_LIMIT order that has not triggered.
      minProperties: 1
      properties:
        limitPrice:
          $ref: '#/components/schemas/Decimal'
        stopPrice:
          $ref: '#/components/schemas/Decimal'
      example:
        limitPrice: '148.00'
    Order:
      type: object
      required: [orderId, clientOrderId, symbol, side, orderType, quantity, status, submittedAt]
      properties:
        orderId:
          type: string
          format: uuid
        clientOrderId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          $ref: '#/components/schemas/Decimal'
        limitPrice:
          $ref: '#/components/schemas/Decimal'
        stopPrice:
          $ref: '#/components/schemas/Decimal'
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejection:
          $ref: '#/components/schemas/Rejection'
        fill:
          $ref: '#/components/schemas/Fill'
        submittedAt:
          type: string
          format: date-time
        triggeredAt:
          type: string
          format: date-time
          description: STOP_LIMIT only. When the stop price was reached.
        completedAt:
          type: string
          format: date-time
      example:
        orderId: 3f6c2a0e-8b1d-4c5e-9a7f-2d4b6e8c1a90
        clientOrderId: 9b1e4c2a-7d3f-4a8e-b6c5-1f2e3d4c5b6a
        symbol: AAPL
        side: BUY
        orderType: LIMIT
        quantity: '10'
        limitPrice: '150.00'
        status: ACCEPTED
        submittedAt: '2026-09-25T14:02:03Z'
    Rejection:
      type: object
      description: Set when status is REJECTED.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNKNOWN_SYMBOL
            - INSUFFICIENT_CASH
            - INSUFFICIENT_HOLDING
            - INSTRUMENT_NOT_TRADABLE
            - MARKET_CLOSED
            - INVALID_QUANTITY
            - INVALID_PRICE
            - QUOTE_UNAVAILABLE
            - QUOTE_STALE
        message:
          type: string
    Fill:
      type: object
      description: Set when status is FILLED.
      required: [price, quantity, amount, currency, filledAt]
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        filledAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # --- Account and cash ---------------------------------------------------
    Account:
      type: object
      required: [cash, positions]
      properties:
        cash:
          type: array
          items:
            $ref: '#/components/schemas/CashBalance'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    CashBalance:
      type: object
      description: "`available` is `total` minus what open buy orders have reserved."
      required: [currency, total, available]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          $ref: '#/components/schemas/Decimal'
        available:
          $ref: '#/components/schemas/Decimal'
      example:
        currency: USD
        total: '5000.00'
        available: '3500.00'
    Position:
      type: object
      description: "`available` is `quantity` minus what open sell orders have reserved."
      required: [symbol, quantity, available, averageCost, currency]
      properties:
        symbol:
          type: string
        quantity:
          $ref: '#/components/schemas/Decimal'
        available:
          $ref: '#/components/schemas/Decimal'
        averageCost:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
      example:
        symbol: AAPL
        quantity: '10'
        available: '10'
        averageCost: '150.00'
        currency: USD
    CreateCashMovementRequest:
      type: object
      required: [transactionId, type, amount, currency]
      properties:
        transactionId:
          type: string
          format: uuid
          description: |
            Idempotency key, same idea as `clientOrderId`. A repeated value
            returns the original movement instead of moving cash twice.
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: A currency that supported instruments trade in, e.g. USD or INR. Others return 400.
      example:
        transactionId: 5d2a8f1c-3b4e-4c6d-9e7f-0a1b2c3d4e5f
        type: DEPOSIT
        amount: '5000.00'
        currency: USD
    CashMovement:
      type: object
      required: [movementId, transactionId, type, amount, currency, balanceAfter, createdAt]
      properties:
        movementId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/Currency'
        balanceAfter:
          $ref: '#/components/schemas/Decimal'
        createdAt:
          type: string
          format: date-time
      example:
        movementId: 7e3b9d2f-1a4c-4e8b-a6d5-2c3b4a5f6e7d
        transactionId: 5d2a8f1c-3b4e-4c6d-9e7f-0a1b2c3d4e5f
        type: DEPOSIT
        amount: '5000.00'
        currency: USD
        balanceAfter: '5000.00'
        createdAt: '2026-09-25T14:00:00Z'

    # --- Admin ----------------------------------------------------------------
    Client:
      type: object
      required: [clientId, email]
      properties:
        clientId:
          type: string
        email:
          type: string
          format: email
    ClientPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        page:
          $ref: '#/components/schemas/PageMetadata'
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [clientId]
          properties:
            clientId:
              type: string
      example:
        clientId: a81f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        orderId: 3f6c2a0e-8b1d-4c5e-9a7f-2d4b6e8c1a90
        clientOrderId: 9b1e4c2a-7d3f-4a8e-b6c5-1f2e3d4c5b6a
        symbol: AAPL
        side: BUY
        orderType: LIMIT
        quantity: '10'
        limitPrice: '150.00'
        status: ACCEPTED
        submittedAt: '2026-09-25T14:02:03Z'
    AdminOrderPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
        page:
          $ref: '#/components/schemas/PageMetadata'
    TickerBatchRequest:
      type: object
      required:
        - tickers
      properties:
        tickers:
          type: array
          minItems: 1
          maxItems: 25
          description: Array of stock ticker symbols (up to 25 items)
          example: [ "AAPL", "MSFT", "GOOGL", "AMZN" ]
          items:
            type: string
            pattern: '^[A-Z0-9.-]{1,10}$'
            example: "AAPL"
    OrderLifecycle:
      type: object
      required: [order, events]
      properties:
        order:
          $ref: '#/components/schemas/AdminOrder'
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrderEvent'
    OrderEvent:
      type: object
      required: [status, occurredAt]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        occurredAt:
          type: string
          format: date-time
        quote:
          allOf:
            - $ref: '#/components/schemas/Quote'
          description: The quote used. Set on FILLED, and when a STOP_LIMIT is triggered.
        limitPrice:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The order's limit price after this event. Set on ACCEPTED and on every price change.
        stopPrice:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The order's stop price after this event. Set like `limitPrice`, for STOP_LIMIT orders.
        detail:
          type: string
          description: Extra context, e.g. the rejection reason or `Price changed by client`.
